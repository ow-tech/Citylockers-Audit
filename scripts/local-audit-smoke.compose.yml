# Disposable-only services for scripts/local-audit-smoke.sh.
# The runner assigns a fresh Compose project name and temporary credentials; this
# file declares no persistent volumes and never references developer services.
services:
  central-postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: audit_smoke
      POSTGRES_USER: audit_smoke
      POSTGRES_PASSWORD: ${AUDIT_SMOKE_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${AUDIT_SMOKE_CENTRAL_PG_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_smoke -d audit_smoke"]
      interval: 2s
      timeout: 2s
      retries: 30

  central-audit-api:
    build: ..
    environment:
      DATABASE_URL: postgresql://audit_smoke:${AUDIT_SMOKE_POSTGRES_PASSWORD}@central-postgres:5432/audit_smoke
      AUDIT_INGEST_TOKEN: ${AUDIT_SMOKE_INGEST_TOKEN}
      AUDIT_QUERY_TOKEN: ${AUDIT_SMOKE_QUERY_TOKEN}
      AUDIT_VERSION: local-smoke
      AUDIT_COMMIT_SHA: local-only
    ports:
      - "127.0.0.1:${AUDIT_SMOKE_AUDIT_PORT}:8080"
    depends_on:
      central-postgres:
        condition: service_healthy

  khizana-postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: khizana_smoke
      POSTGRES_USER: khizana_smoke
      POSTGRES_PASSWORD: ${AUDIT_SMOKE_KHIZANA_PASSWORD}
    ports:
      - "127.0.0.1:${AUDIT_SMOKE_KHIZANA_PG_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khizana_smoke -d khizana_smoke"]
      interval: 2s
      timeout: 2s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.local-smoke.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:${AUDIT_SMOKE_MQTT_PORT}:1883"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${AUDIT_SMOKE_REDIS_PORT}:6379"
