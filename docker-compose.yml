services:
  audit-api:
    build: .
    environment:
      DATABASE_URL: postgresql://audit:audit@postgres:5432/audit
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - audit-postgres:/var/lib/postgresql/data
volumes:
  audit-postgres:
